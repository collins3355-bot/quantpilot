[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quantpilot"
version = "0.1.0"
description = "Quantization autotuner: find the best quant for your model, your hardware, and your quality budget"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dependencies = []

[project.urls]
Repository = "https://github.com/collins3355-bot/quantpilot"

[project.scripts]
quantpilot = "quantpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
